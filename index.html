<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Banking System UI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .atm-card { background: #1e293b; border-radius: 16px; width: 380px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); border: 1px solid #334155; }
        .header { text-align: center; margin-bottom: 24px; }
        .header h2 { color: #38bdf8; font-size: 22px; margin-bottom: 4px; }
        .header p { color: #94a3b8; font-size: 13px; }
        .screen-display { background: #090d16; border-radius: 12px; padding: 16px; margin-bottom: 20px; border: 1px solid #1e293b; text-align: center; }
        .balance-title { color: #64748b; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .balance-amount { color: #4ade80; font-size: 28px; font-weight: bold; margin-top: 4px; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
        .input-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; outline: none; }
        .input-group input:focus { border-color: #38bdf8; }
        .grid-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .btn { padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 13px; }
        .btn-primary { background: #0284c7; color: white; }
        .btn-primary:hover { background: #0369a1; }
        .btn-success { background: #16a34a; color: white; }
        .btn-success:hover { background: #15803d; }
        .btn-warning { background: #d97706; color: white; }
        .btn-warning:hover { background: #b45309; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-danger:hover { background: #b91c1c; }
        .full-width { grid-column: span 2; }
    </style>
</head>
<body>

<div class="atm-card">
    <div class="header">
        <h2>AWAIS BANK ATM</h2>
        <p>C++ Powered Web System</p>
    </div>

    <!-- Screen Display -->
    <div class="screen-display">
        <div class="balance-title">Current Balance</div>
        <div id="balance" class="balance-amount">PKR 22500.40</div>
    </div>

    <!-- User Input Section -->
    <div class="input-group">
        <label>Enter Amount</label>
        <input type="number" id="amountInput" placeholder="e.g. 5000">
    </div>

    <!-- Action Buttons -->
    <div class="grid-actions">
        <button onclick="checkBalance()" class="btn btn-primary">Check Balance</button>
        <button onclick="depositMoney()" class="btn btn-success">Deposit</button>
        <button onclick="withdrawMoney()" class="btn btn-warning">Withdraw</button>
        <button onclick="alert('PIN Change System Active')" class="btn btn-danger">Change PIN</button>
        <button onclick="alert('Logged Out')" class="btn btn-primary full-width">Exit / Logout</button>
    </div>
</div>

<script>
    const SERVER_URL = 'http://localhost:8080';

    // 1. C++ se Current Balance mangein
    async function checkBalance() {
        try {
            let res = await fetch(SERVER_URL + '/api/balance');
            let data = await res.text();
            document.getElementById('balance').innerText = "PKR " + parseFloat(data).toFixed(2);
        } catch (err) {
            alert("Make sure C++ Server is running on terminal!");
        }
    }

    // 2. Deposit Amount C++ Backend ko bhejein
    async function depositMoney() {
        let amt = document.getElementById('amountInput').value;
        if(!amt || amt <= 0) { alert("Enter valid amount!"); return; }

        try {
            let res = await fetch(SERVER_URL + '/api/deposit', {
                method: 'POST',
                body: amt
            });
            let data = await res.text();
            document.getElementById('balance').innerText = "PKR " + parseFloat(data).toFixed(2);
            document.getElementById('amountInput').value = '';
        } catch (err) {
            alert("Error connecting to C++ Backend!");
        }
    }

    // 3. Withdraw Amount C++ Backend ko bhejein
    async function withdrawMoney() {
        let amt = document.getElementById('amountInput').value;
        if(!amt || amt <= 0) { alert("Enter valid amount!"); return; }

        try {
            let res = await fetch(SERVER_URL + '/api/withdraw', {
                method: 'POST',
                body: amt
            });
            let data = await res.text();

            if (data === "INSUFFICIENT") {
                alert("INSUFFICIENT BALANCE IN C++ ACCOUNT!");
            } else {
                document.getElementById('balance').innerText = "PKR " + parseFloat(data).toFixed(2);
            }
            document.getElementById('amountInput').value = '';
        } catch (err) {
            alert("Error connecting to C++ Backend!");
        }
    }
</script>

</body>
</html>
